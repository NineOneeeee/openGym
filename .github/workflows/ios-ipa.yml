name: iOS unsigned IPA

# Builds the same unsigned .ipa that the GitLab `build:ios` job in this repo
# produces, on a GitHub-hosted macOS runner — no local Xcode needed.
#
# The .ipa this gives you is UNSIGNED. Sign it with your own Apple ID through
# Sideloadly / AltStore / Xcode before it will install on a device.
#
# Cost: free on a public repository (a fork of a public repo stays public).
# On a private repo macOS runners bill at 10x, so a ~20 minute build costs
# ~200 of the 2,000 free minutes a month.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build'
        required: true
        default: 'v1.4.1'
      upload_artifact:
        description: 'Upload the .ipa as a build artifact'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build unsigned ipa
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `inputs.ref` is empty on a tag push, which makes checkout fall back
          # to the ref that triggered the run.
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Select Xcode
        # Pin the toolchain: `macos-latest` moved from Xcode 16.4 to 26.4.1 in
        # June 2026 and will move again. Capacitor 7 is built and tested against
        # the 16.x SDK, which is what macos-15 still ships as its default.
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          else
            echo "Xcode_16.4.app not on this image; using the default"
          fi
          xcodebuild -version
          echo "---"
          pod --version
          echo "---"
          node -v

      - name: Install JS dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the mobile web bundle
        working-directory: frontend
        run: npm run build:mobile

      - name: Read the version
        id: version
        working-directory: frontend
        run: |
          set -eu
          VER="$(node -p "require('./package.json').version")"
          # Same build number the Android app uses, so both count the same way.
          BUILD="$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' android/app/build.gradle | sed -n 1p)"
          [ -n "$BUILD" ] || { echo "could not read versionCode" >&2; exit 1; }
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "building openGym $VER ($BUILD)"

      - name: Archive without signing
        working-directory: frontend/ios/App
        run: |
          set -eu
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.ver }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package the ipa
        working-directory: frontend/ios/App
        run: |
          set -eu
          VER="${{ steps.version.outputs.ver }}"
          APP="build/App.xcarchive/Products/Applications/App.app"
          [ -d "$APP" ] || { echo "no App.app in the archive" >&2; exit 1; }
          # An .ipa is a zip with the .app under Payload/.
          mkdir -p Payload
          cp -R "$APP" Payload/
          OUT="$GITHUB_WORKSPACE/openGym-$VER-unsigned.ipa"
          zip -qry "$OUT" Payload
          shasum -a 256 "$OUT" | awk '{print $1}' > "$OUT.sha256"
          ls -lh "$OUT"
          cat "$OUT.sha256"

      - name: Upload the artifact
        if: inputs.upload_artifact != false
        uses: actions/upload-artifact@v4
        with:
          name: openGym-${{ steps.version.outputs.ver }}-unsigned-ipa
          path: |
            openGym-*-unsigned.ipa
            openGym-*-unsigned.ipa.sha256
          # The bundle is mostly already-compressed media; zipping it again buys
          # nothing and costs minutes.
          compression-level: 0
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            openGym-*-unsigned.ipa openGym-*-unsigned.ipa.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY" || \
          echo "no release for $GITHUB_REF_NAME yet — artifact is the only copy"
